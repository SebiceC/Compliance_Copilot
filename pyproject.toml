[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-copilot"
version = "0.1.0"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2",
]

# Dependencias solo para desarrollo (PEP 735): no se instalan para quien usa la herramienta.
# Instalar con: pip install --group dev
[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
