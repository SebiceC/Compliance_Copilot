[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-copilot"
version = "0.1.0"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2",
    "openpyxl>=3.1",  # entregables .xlsx (matriz de riesgos, SoA, plan de remediación)
]

# Dependencias solo para desarrollo (PEP 735): no se instalan para quien usa la herramienta.
# Instalar con: pip install --group dev
[dependency-groups]
dev = [
    "pytest>=8",
]

# Los catálogos JSON viajan dentro del paquete.
[tool.setuptools.package-data]
"compliance_copilot.catalogs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
